<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>govind@portfolio — terminal</title>
<meta name="description" content="Govind S R — Cyber Security Engineer. A terminal-styled interactive portfolio." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9646;</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="page">

  <div class="scrollback" id="scrollback">
    <div class="output" id="output"></div>
  </div>

  <div class="composer" id="composer">
    <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>

    <div class="input-box">
      <span class="chevron" aria-hidden="true">&gt;</span>
      <div class="input-wrap">
        <input
          id="cmd-input"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="terminal command input"
          placeholder="Type / for commands…"
        />
      </div>
    </div>

    <div class="status-line">
      <span class="cwd">~/govind-portfolio</span>
      <span class="status-hints">
        <span><kbd>/</kbd>commands</span>
        <span><kbd>Tab</kbd>autocomplete</span>
        <span><kbd>&uarr;&darr;</kbd>history</span>
        <span><kbd>Ctrl</kbd>+<kbd>L</kbd>clear</span>
      </span>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
